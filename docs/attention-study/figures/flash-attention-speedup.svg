  </g>
  <g id="text_20">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="69.984" transform="rotate(-0 51.84 69.984)">L40S and W7900 · FP16 · sequence length 2,560 · batch 4 · 16 heads · head dim 16</text>
  </g>
  <g id="text_21">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.84 403.087031)">PyTorch: MATH → FLASH_ATTENTION backend.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.84 421.94)">ONNX Runtime / L40S: legacy SDPA decomposition → Attention-24 (FlashAttention).</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.84 440.64)">ONNX Runtime / W7900: same legacy graph, default → explicit MIGraphX attention fusion.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(51.84 480.672)">Unmasked attention microbenchmark; median steady-state latency. ORT uses device I/O binding (no host transfers).</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #555555" transform="translate(51.84 495.072)">PyTorch 2.9.1 · ORT 1.29 CUDA / 1.23.2 MIGraphX · ROCm 7.2.4. Gains are within each stack, not end-to-end MLPF speedups.</text>
  </g>
