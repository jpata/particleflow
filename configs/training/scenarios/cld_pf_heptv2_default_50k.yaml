# Recommended CLD hit-model training recipe, promoted from the tracker-feature ablation.
name: cld_pf_heptv2_default_50k
spec_file: particleflow_spec.yaml
production_name: cld
variants:
  hit_heptv2_grouped_tracker_features:
    model_name: pyg-cld-hits-heptv2-set-v1
seeds:
- 12345
training:
  global_batch_size: 64
  parameters:
    lr: 0.001
    num_steps: 50000
    val_freq: 5000
    checkpoint_freq: 1000
    nvalid: 512
    ntest: 512
    sampler_mode: interleaved-shards
    validation_diagnostics_batches: 4
    validation_linear_probe: true
    validation_linear_probe_max_events: 16
    pad_to_multiple_elements: 128
    make_plots: true
