      test_dataset: *cld_granularity_hcal_samples
  cld_hcal_30mm:
    model_name: pyg-cld-v1
    production_name: cld
    data_root: cld_granularity
    data_subdir: hcal_30mm/tfds
    overrides:
      train_dataset.cld.physical.samples: *cld_granularity_hcal_samples
      valid_dataset.cld.physical.samples: *cld_granularity_hcal_samples
      test_dataset: *cld_granularity_hcal_samples
seeds: [12345]
training:
  global_batch_size: 16
  parameters:
    optimizer: lamb
    lr: 0.0005
    lr_schedule: onecycle
    lr_schedule_config.onecycle.pct_start: 0.3
    num_steps: 500000
    tensorboard_step_freq: 1000
    benchmark.enabled: true
    benchmark.sample_interval_seconds: 1.0
    benchmark.warmup_steps: 100
    benchmark.gpu_timing_interval: 0
    val_freq: 1000
    checkpoint_freq: 2000
    # Keep the 30k-update stopping window: 30 validation cycles at 1k steps.
    patience: 30
    nvalid: 256
    ntest: 256
    sampler_mode: interleaved-shards
    pad_to_multiple_elements: 128
    validation_particle_metrics: true
    make_plots: true
    # Set load to a completed attention joint run; HEPTv2 weights are incompatible.
    load: experiments/pf_fm_joint/joint_seed12345_20261114_063930_566389/checkpoints/checkpoint-500000.pth
    load_weights_only: true
    reset_task_loss_weights: true
common_overrides:
  model.type: attention
  model.heptv2: null
  model.attention:
    num_convs: 6
    num_heads: 16
    head_dim: 16
    attention_type: flash
    dropout_ff: 0.0
  model.input_encoding: split
  model.feature_bag: true
  model.input_normalization: true
  model.backbone.mode: shared
  model.backbone.num_convs: 6
  model.trainable: all
allowed_variant_differences:
  - data_dir
  - dataset
  - hyperparameters.lr
  - input_dim
  - train_dataset
  - valid_dataset
  - test_dataset
  - enabled_test_datasets
  - data_config
