# Transfer the ColliderML attention checkpoint to each Key4hep v1.4.0 detector.
name: pf_fm_finetuning
spec_file: particleflow_spec.yaml
production_name: cld
variants:
  cld:
    model_name: pyg-cld-key4hep-v140
    production_name: cld
  clic:
    model_name: pyg-clic-key4hep-v140
    production_name: clic
  ild:
    model_name: pyg-ild-key4hep-v140
    production_name: ild
  idea:
    model_name: pyg-idea-key4hep-v140
    production_name: idea

seeds: [12345]
training:
  global_batch_size: 32
  parameters:
    optimizer: lamb
    lr: 0.001
    lr_schedule: onecycle
    lr_schedule_config.onecycle.pct_start: 0.3
    num_steps: 30000
    tensorboard_step_freq: 1000
    benchmark.enabled: true
    benchmark.sample_interval_seconds: 1.0
    benchmark.warmup_steps: 100
    benchmark.gpu_timing_interval: 0
    val_freq: 1000
    checkpoint_freq: 2000
    patience: 30
    nvalid: 256
    ntest: 256
    sampler_mode: interleaved-shards
    pad_to_multiple_elements: 128
    validation_particle_metrics: true
    make_plots: true
    # Initialize from the completed ColliderML 25% joint variant.
    load: experiments/pf_fm_joint/data_25pct_seed12345_20261123_114353_941601/checkpoints/checkpoint-100000.pth
    load_weights_only: true
    reset_task_loss_weights: true
common_overrides:
  model.type: attention
  model.heptv2: null
  model.attention:
    num_convs: 4
    num_heads: 16
    head_dim: 32
    attention_type: flash
    dropout_ff: 0.0
  model.input_encoding: split
  model.feature_bag: true
  model.input_normalization: true
  model.backbone.mode: shared
  model.backbone.num_convs: 4
  model.trainable: all
allowed_variant_differences:
  - data_dir
  - dataset
  - input_dim
  - train_dataset
  - valid_dataset
  - test_dataset
  - enabled_test_datasets
