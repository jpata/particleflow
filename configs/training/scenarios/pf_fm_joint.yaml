# ColliderML-only pretraining for transfer to the Key4hep v1.4.0 detectors.
name: pf_fm_joint
spec_file: particleflow_spec.yaml
production_name: colliderml
variants:
  joint: &joint_model
    model_name: pyg-colliderml-v1
  data_25pct:
    <<: *joint_model
    overrides:
      train_fraction: 0.25
  data_50pct:
    <<: *joint_model
    overrides:
      train_fraction: 0.5
  data_75pct:
    <<: *joint_model
    overrides:
      train_fraction: 0.75

seeds: [12345]
training:
  global_batch_size: 32
  parameters:
    optimizer: lamb
    lr: 0.001
    lr_schedule: onecycle
    lr_schedule_config.onecycle.pct_start: 0.3
    num_steps: 100000
    tensorboard_step_freq: 1000
    benchmark.enabled: true
    benchmark.sample_interval_seconds: 1.0
    benchmark.warmup_steps: 100
    benchmark.gpu_timing_interval: 0
    val_freq: 10000
    checkpoint_freq: 2000
    patience: 1000
    nvalid: 256
    ntest: 256
    sampler_mode: interleaved-shards
    pad_to_multiple_elements: 128
    validation_particle_metrics: true
    make_plots: true
common_overrides:
  model.type: attention
  model.heptv2: null
  model.attention:
    num_convs: 4
    num_heads: 16
    head_dim: 32
    attention_type: flash
    dropout_ff: 0.0
  model.input_encoding: split
  model.feature_bag: true
  model.input_normalization: true
  model.backbone.mode: shared
  model.backbone.num_convs: 4
allowed_variant_differences:
  - train_fraction
