# Auxiliary-only ablation: identical learned readout and training budget.
name: cld_pf_heptv2_fit_loss_50k
spec_file: particleflow_spec.yaml
production_name: cld
variants:
  tracker_features_baseline:
    model_name: pyg-cld-hits-heptv2-set-v1
    overrides: {}
  tracker_geometry:
    model_name: pyg-cld-hits-heptv2-set-v1
    overrides:
      model.set_decoder.tracker_geometry_loss_weight: 0.01
  tracker_curvature:
    model_name: pyg-cld-hits-heptv2-set-v1
    overrides:
      model.set_decoder.tracker_curvature_loss_weight: 0.1
  tracker_geometry_curvature:
    model_name: pyg-cld-hits-heptv2-set-v1
    overrides:
      model.set_decoder.tracker_geometry_loss_weight: 0.01
      model.set_decoder.tracker_curvature_loss_weight: 0.1
seeds:
- 12345
training:
  global_batch_size: 64
  parameters:
    lr: 0.001
    num_steps: 50000
    val_freq: 5000
    checkpoint_freq: 1000
    nvalid: 512
    ntest: 512
    sampler_mode: interleaved-shards
    validation_diagnostics_batches: 4
    validation_linear_probe: true
    validation_linear_probe_max_events: 16
    pad_to_multiple_elements: 128
    make_plots: true
allowed_variant_differences:
- model.set_decoder
