name: cms_backbone_comparison
spec_file: particleflow_spec.yaml
production_name: cms_run3

variants:
  attention:
    model_name: pyg-cms-v1
    overrides:
      # Match the width-512 CMS default: 16 heads with 32 channels each.
      model.attention.num_heads: 16
      model.attention.head_dim: 32
  heptv2:
    model_name: pyg-cms-v1
    overrides:
      model.type: heptv2
      model.attention: null
      model.heptv2.embedding_dim: 512
      model.heptv2.width: 512
      model.heptv2.num_convs: 3
      model.heptv2.num_heads: 16
      model.heptv2.dropout_ff: 0.0
      model.heptv2.block_size: 100
      model.heptv2.n_hashes: 3
      model.heptv2.deterministic_hashing: true

seeds: [12345]

training:
  # Match v2.6.0pre1: 8 GPUs x multiplier 12 x dataset batches 1/8.
  # The runner derives the multiplier for each platform. With batches proportional
  # to event counts, the default mix gives PU ~44% of updates (v3.2.0: ~9%).
  global_batch_size:
    physical_pu: 96
    physical_nopu: 768
  parameters:
    # Retain the v3.2.0 LR and calibrated objective while correcting exposure;
    # the historical LR 0.002 needs a separate lr-find on these larger models.
    lr: 0.0004
    lr_schedule: cosinedecay
    # Historical TensorBoard reaches step 316400 (~10 passes); v3.2.0's
    # 100k steps at uniform batch 64 only covered ~0.43 passes per group.
    num_steps: 320000
    val_freq: 10000
    checkpoint_freq: 10000
    tensorboard_step_freq: 100
    # Per sample, across its ten shards. Keep test inputs fixed for comparison
    # with the uploaded v3.2.0 paired reference evaluation.
    nvalid: 5000
    ntest: 512
    sampler_mode: interleaved-shards
    validation_diagnostics_batches: 4
    validation_particle_metrics_max_events: 128
    pad_to_multiple_elements: 100
    make_plots: true

common_overrides:
  model.output_mode: elementwise
  model.task_queries: false
  model.backbone.mode: shared
  model.backbone.num_convs: 3

  # Preserve the historical 1:8 PU/no-PU event-batch ratio. Leave train-group
  # weights unset: batches-per-epoch mixing gives each group equal data passes.
  train_dataset.cms.physical_pu.batch_size: 1
  train_dataset.cms.physical_nopu.batch_size: 8
  valid_dataset.cms.physical_pu.batch_size: 1
  valid_dataset.cms.physical_nopu.batch_size: 8

  # Pin every sample explicitly: pyg-cms-v1 otherwise selects version 3.2.0.
  train_dataset.cms.physical_pu.samples.cms_pf_ttbar.version: "2.8.0"
  train_dataset.cms.physical_pu.samples.cms_pf_qcd.version: "2.8.0"
  train_dataset.cms.physical_pu.samples.cms_pf_ztt.version: "2.8.0"
  train_dataset.cms.physical_nopu.samples.cms_pf_ttbar_nopu.version: "2.8.0"
  train_dataset.cms.physical_nopu.samples.cms_pf_qcd_nopu.version: "2.8.0"
  train_dataset.cms.physical_nopu.samples.cms_pf_ztt_nopu.version: "2.8.0"
  valid_dataset.cms.physical_pu.samples.cms_pf_ttbar.version: "2.8.0"
  valid_dataset.cms.physical_pu.samples.cms_pf_qcd.version: "2.8.0"
  valid_dataset.cms.physical_pu.samples.cms_pf_ztt.version: "2.8.0"
  valid_dataset.cms.physical_nopu.samples.cms_pf_ttbar_nopu.version: "2.8.0"
  valid_dataset.cms.physical_nopu.samples.cms_pf_qcd_nopu.version: "2.8.0"
  valid_dataset.cms.physical_nopu.samples.cms_pf_ztt_nopu.version: "2.8.0"
  test_dataset.cms_pf_ttbar.version: "2.8.0"
  test_dataset.cms_pf_qcd.version: "2.8.0"
  test_dataset.cms_pf_ztt.version: "2.8.0"

allowed_variant_differences:
  - conv_type
  - model.type
  - model.attention
  - model.heptv2
