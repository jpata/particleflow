# PF foundation-model transfer study on the Key4hep v1.4.0 datasets with ColliderML pu0, at the mid size of
# the third attention scaling study: 6 layers x 16 heads, head dim 32 (width 512), peak lr 3.5e-4 (LAMB,
# OneCycle), 16 events per step, feature bag and input normalization on everywhere, no early stopping.
#
# Stage 1 (array 0-8, independent):
#   experts      cld, clic, ild, idea, colliderml  -- colliderml is also the ColliderML-only pretraining
#   joints       joint_no<det>: ColliderML + three of CLD/CLIC/ILD/IDEA (pyg-fm-v140-joint-no<det>)
# Stage 2 (array 9-16, weights-only fine-tunes, full model trainable, task loss weights recalibrated):
#   ft_cml_<det> from the colliderml expert's final checkpoint
#   ft_loo_<det> from joint_no<det>'s final checkpoint (the detector that joint never saw)
# Stage-2 `load` paths are null until the stage-1 runs finish; the runner refuses to start them before
# they are filled in. Every run trains 300k steps except the IDEA expert and IDEA fine-tunes (100k).
name: pf_fm_v140_mid
spec_file: particleflow_spec.yaml
production_name: cld
variants:
  # --- stage 1: experts ---
  cld:
    model_name: pyg-cld-key4hep-v140
    production_name: cld
  clic:
    model_name: pyg-clic-key4hep-v140
    production_name: clic
  ild:
    model_name: pyg-ild-key4hep-v140
    production_name: ild
  idea:
    model_name: pyg-idea-key4hep-v140
    production_name: idea
    overrides:
      num_steps: 100000  # IDEA: 100k steps (~40 epochs of its ~40k training events)
  colliderml:
    model_name: pyg-colliderml-v1
    production_name: colliderml
  # --- stage 1: leave-one-detector-out joints ---
  joint_nocld:
    model_name: pyg-fm-v140-joint-nocld
    production_name: fm_v140_joint
  joint_noclic:
    model_name: pyg-fm-v140-joint-noclic
    production_name: fm_v140_joint
  joint_noild:
    model_name: pyg-fm-v140-joint-noild
    production_name: fm_v140_joint
  joint_noidea:
    model_name: pyg-fm-v140-joint-noidea
    production_name: fm_v140_joint
  # --- stage 2: fine-tunes from the ColliderML-only pretraining (colliderml expert) ---
  ft_cml_cld:
    model_name: pyg-cld-key4hep-v140
    production_name: cld
    overrides: &ft_cml
      load: null  # TODO: <colliderml run>/checkpoints/checkpoint-<num_steps>.pth
      load_weights_only: true
      reset_task_loss_weights: true
      model.trainable: all
  ft_cml_clic:
    model_name: pyg-clic-key4hep-v140
    production_name: clic
    overrides: *ft_cml
  ft_cml_ild:
    model_name: pyg-ild-key4hep-v140
    production_name: ild
    overrides: *ft_cml
  ft_cml_idea:
    model_name: pyg-idea-key4hep-v140
    production_name: idea
    overrides:
      <<: *ft_cml
      num_steps: 100000
  # --- stage 2: fine-tunes on the detector each joint left out ---
  ft_loo_cld:
    model_name: pyg-cld-key4hep-v140
    production_name: cld
    overrides:
      load: null  # TODO: <joint_nocld run>/checkpoints/checkpoint-<num_steps>.pth
      load_weights_only: true
      reset_task_loss_weights: true
      model.trainable: all
  ft_loo_clic:
    model_name: pyg-clic-key4hep-v140
    production_name: clic
    overrides:
      load: null  # TODO: <joint_noclic run>/checkpoints/checkpoint-<num_steps>.pth
      load_weights_only: true
      reset_task_loss_weights: true
      model.trainable: all
  ft_loo_ild:
    model_name: pyg-ild-key4hep-v140
    production_name: ild
    overrides:
      load: null  # TODO: <joint_noild run>/checkpoints/checkpoint-<num_steps>.pth
      load_weights_only: true
      reset_task_loss_weights: true
      model.trainable: all
  ft_loo_idea:
    model_name: pyg-idea-key4hep-v140
    production_name: idea
    overrides:
      load: null  # TODO: <joint_noidea run>/checkpoints/checkpoint-<num_steps>.pth
      load_weights_only: true
      reset_task_loss_weights: true
      model.trainable: all
      num_steps: 100000
seeds: [12345]
training:
  global_batch_size: 16
  parameters:
    optimizer: lamb
    lr: 0.00035
    lr_schedule: onecycle
    lr_schedule_config.onecycle.pct_start: 0.3
    num_steps: 300000
    tensorboard_step_freq: 1000
    benchmark.enabled: true
    benchmark.sample_interval_seconds: 1.0
    benchmark.warmup_steps: 100
    benchmark.gpu_timing_interval: 0
    val_freq: 10000
    checkpoint_freq: 2000
    # Early stopping off: more than the number of validations, so every run trains num_steps.
    patience: 1000
    nvalid: 256
    ntest: 256
    sampler_mode: interleaved-shards
    pad_to_multiple_elements: 128
    validation_particle_metrics: true
    make_plots: true
common_overrides:
  model.type: attention
  model.heptv2: null
  model.attention:
    num_convs: 6
    num_heads: 16
    head_dim: 32
    attention_type: flash
    dropout_ff: 0.0
  model.input_encoding: split
  model.feature_bag: true
  model.input_normalization: true
  model.backbone.mode: shared
  model.backbone.num_convs: 6
allowed_variant_differences:
  - num_steps
  - data_dir
  - dataset
  - hyperparameters.lr  # spec recipe metadata; the top-level lr is shared
  - input_dim
  - train_dataset
  - valid_dataset
  - test_dataset
  - enabled_test_datasets
  - data_config
  - load
  - load_weights_only
  - reset_task_loss_weights
  - model.trainable
