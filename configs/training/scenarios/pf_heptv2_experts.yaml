# Matched track/cluster HEPTv2 experts. This defines runs; it submits none.
# One GPU each for CLIC, CLD and IDEA. ColliderML uses four GPUs.
# Every expert presents 16 events per optimizer step and runs 100,000 updates.
# Patience exceeds the 50 validation cycles, keeping update counts identical.
name: pf_heptv2_experts
spec_file: particleflow_spec.yaml
production_name: cld
variants:
  cld:
    model_name: pyg-cld-v1
    gpus: 1
  clic:
    model_name: pyg-clic-v1
    production_name: clic
    gpus: 1
  idea:
    model_name: pyg-idea-pipeline-v1
    production_name: idea
    gpus: 1
  colliderml:
    model_name: pyg-colliderml-v1
    production_name: colliderml
    gpus: 4
seeds: [12345]
training:
  global_batch_size: 16
  parameters:
    optimizer: lamb
    lr: 0.0005
    lr_schedule: onecycle
    lr_schedule_config.onecycle.pct_start: 0.3
    num_steps: 100000
    tensorboard_step_freq: 1000
    val_freq: 2000
    checkpoint_freq: 2000
    patience: 1000
    nvalid: 256
    ntest: 0
    sampler_mode: interleaved-shards
    pad_to_multiple_elements: 128
    validation_particle_metrics: false
    make_plots: false
    test_dataset: {}
common_overrides:
  model.type: heptv2
  model.attention: null
  model.input_encoding: split
  model.backbone.mode: shared
  model.backbone.num_convs: 6
  model.heptv2.num_convs: 6
  model.heptv2.embedding_dim: 256
  model.heptv2.width: 256
  model.heptv2.num_heads: 16
  model.heptv2.dropout_ff: 0.0
  model.heptv2.block_size: 128
  model.heptv2.deterministic_hashing: true
  model.heptv2.activation_checkpointing: true
  model.heptv2.track_hash_at_calo: false
  model.heptv2.cluster_hash_at_centroid: false
allowed_variant_differences:
  - data_dir
  - dataset
  - hyperparameters.lr  # retained recipe metadata; top-level lr is shared
  - input_dim
  - train_dataset
  - valid_dataset
  - test_dataset
  - enabled_test_datasets
