# Full joint campaign with the same number of optimizer updates as each expert.
name: pf_heptv2_joint
spec_file: particleflow_spec.yaml
production_name: cld
variants:
  joint:
    model_name: pyg-cldcliccolliderml-v1
    production_name: cld_clic_colliderml
    gpus: 4
seeds: [12345]
training:
  global_batch_size: 16
  parameters:
    optimizer: lamb
    lr: 0.0005
    lr_schedule: onecycle
    lr_schedule_config.onecycle.pct_start: 0.3
    num_steps: 100000
    tensorboard_step_freq: 1000
    val_freq: 2000
    checkpoint_freq: 2000
    patience: 1000
    nvalid: 256
    ntest: 0
    sampler_mode: interleaved-shards
    pad_to_multiple_elements: 128
    validation_particle_metrics: false
    make_plots: false
    test_dataset: {}
common_overrides:
  model.type: heptv2
  model.attention: null
  model.input_encoding: split
  model.feature_bag: true
  model.input_normalization: true
  model.backbone.mode: shared
  model.backbone.num_convs: 6
  model.heptv2.num_convs: 6
  model.heptv2.embedding_dim: 256
  model.heptv2.width: 256
  model.heptv2.num_heads: 16
  model.heptv2.dropout_ff: 0.0
  model.heptv2.block_size: 128
  model.heptv2.deterministic_hashing: true
  model.heptv2.activation_checkpointing: true
  model.heptv2.track_hash_at_calo: true
  model.heptv2.cluster_hash_at_centroid: false
