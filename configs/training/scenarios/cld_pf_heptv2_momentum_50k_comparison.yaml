name: cld_pf_heptv2_momentum_50k_comparison
spec_file: particleflow_spec.yaml
production_name: cld

# Reproduce the completed October 50k HEPTv2 schedule before changing one
# momentum-related factor at a time. The track+cluster MLPF is a physics
# reference; its elementwise objective is different from the hit-set objective.
# Rank variants by held-out matched-particle relative pT/energy errors, jet
# response IQR, and missing-momentum error. Guard particle F1, count bias,
# and jet matching F1 against regressions. Do not choose a variant by test
# threshold tuning or by comparing total loss across different objectives.
variants:
  track_cluster_mlpf:
    model_name: pyg-cld-v1
    overrides:
      model.attention.use_jagged_attention: true

  hit_heptv2_baseline:
    model_name: pyg-cld-hits-heptv2-sector-set-v1
    overrides:
      model.heptv2.num_convs: 6
      model.binary_classification_focal_gamma: 2.0
      model.set_decoder.attention_mode: global-flash
      model.set_decoder.query_init: input-conditioned
      model.set_decoder.local_attention_radius: 0.4
      model.set_decoder.tracker_query_fraction: 0.6
      model.set_decoder.num_layers: 4
      model.set_decoder.num_slots: 256
      model.set_decoder.proposal_mode: grid-diverse
      model.set_decoder.proposal_grid_size: 0.1
      model.set_decoder.use_aggregate_anchors: true
      model.set_decoder.aggregate_grid_size: 0.1
      model.set_decoder.presence_threshold: 0.5
      model.set_decoder.no_object_weight: 1.0
      model.set_decoder.cardinality_loss_weight: 0.05
      model.set_decoder.auxiliary_loss_weight: 0.25
      model.set_decoder.matcher.presence: 1.0
      model.set_decoder.matcher.pid: 1.0
      model.set_decoder.matcher.geometry: 2.0
      model.set_decoder.matcher.pt: 1.0
      model.set_decoder.matcher.energy: 0.0
      model.set_decoder.matcher.dr_scale: 0.1
      model.set_decoder.matcher.log_pt_scale: 0.6931471805599453
      model.set_decoder.matcher.log_energy_scale: 0.6931471805599453

  hit_heptv2_energy_match:
    model_name: pyg-cld-hits-heptv2-sector-set-v1
    overrides:
      model.heptv2.num_convs: 6
      model.binary_classification_focal_gamma: 2.0
      model.set_decoder.attention_mode: global-flash
      model.set_decoder.query_init: input-conditioned
      model.set_decoder.local_attention_radius: 0.4
      model.set_decoder.tracker_query_fraction: 0.6
      model.set_decoder.num_layers: 4
      model.set_decoder.num_slots: 256
      model.set_decoder.proposal_mode: grid-diverse
      model.set_decoder.proposal_grid_size: 0.1
      model.set_decoder.use_aggregate_anchors: true
      model.set_decoder.aggregate_grid_size: 0.1
      model.set_decoder.presence_threshold: 0.5
      model.set_decoder.no_object_weight: 1.0
      model.set_decoder.cardinality_loss_weight: 0.05
      model.set_decoder.auxiliary_loss_weight: 0.25
      model.set_decoder.matcher.presence: 1.0
      model.set_decoder.matcher.pid: 1.0
      model.set_decoder.matcher.geometry: 2.0
      model.set_decoder.matcher.pt: 1.0
      # Tests whether energy-aware assignment gives better training pairs.
      model.set_decoder.matcher.energy: 0.5
      model.set_decoder.matcher.dr_scale: 0.1
      model.set_decoder.matcher.log_pt_scale: 0.6931471805599453
      model.set_decoder.matcher.log_energy_scale: 0.6931471805599453

  hit_heptv2_huber_momentum:
    model_name: pyg-cld-hits-heptv2-sector-set-v1
    overrides:
      model.heptv2.num_convs: 6
      model.binary_classification_focal_gamma: 2.0
      model.set_decoder.attention_mode: global-flash
      model.set_decoder.query_init: input-conditioned
      model.set_decoder.local_attention_radius: 0.4
      model.set_decoder.tracker_query_fraction: 0.6
      model.set_decoder.num_layers: 4
      model.set_decoder.num_slots: 256
      model.set_decoder.proposal_mode: grid-diverse
      model.set_decoder.proposal_grid_size: 0.1
      model.set_decoder.use_aggregate_anchors: true
      model.set_decoder.aggregate_grid_size: 0.1
      model.set_decoder.presence_threshold: 0.5
      model.set_decoder.no_object_weight: 1.0
      model.set_decoder.cardinality_loss_weight: 0.05
      model.set_decoder.auxiliary_loss_weight: 0.25
      model.set_decoder.matcher.presence: 1.0
      model.set_decoder.matcher.pid: 1.0
      model.set_decoder.matcher.geometry: 2.0
      model.set_decoder.matcher.pt: 1.0
      model.set_decoder.matcher.energy: 0.0
      model.set_decoder.matcher.dr_scale: 0.1
      model.set_decoder.matcher.log_pt_scale: 0.6931471805599453
      model.set_decoder.matcher.log_energy_scale: 0.6931471805599453
      # Only the log-pT and log-energy terms change; geometry keeps MSE.
      # Delta=0.2 is approximately a 22% multiplicative momentum residual.
      model.set_decoder.momentum_loss: huber
      model.set_decoder.momentum_huber_delta: 0.2

seeds: [12345]

training:
  global_batch_size: 64
  parameters:
    lr: 0.001
    num_steps: 50000
    val_freq: 5000
    checkpoint_freq: 1000
    nvalid: 512
    ntest: 512
    sampler_mode: interleaved-shards
    validation_diagnostics_batches: 4
    pad_to_multiple_elements: 128
    make_plots: true

common_overrides:
  model.task_queries: false
  model.backbone.mode: shared
  model.backbone.num_convs: 6

allowed_variant_differences:
  - conv_type
  - data_dir
  - dataset
  - elemtypes_nonzero
  - enabled_test_datasets
  - hyperparameters.lr
  - input_dim
  - model.type
  - model.binary_classification_focal_gamma
  - model.attention
  - model.heptv2
  - model.backbone.num_tracker_layers
  - model.backbone.num_calo_layers
  - model.backbone.num_common_layers
  - model.output_mode
  - model.set_decoder
  - train_dataset
  - valid_dataset
  - test_dataset
