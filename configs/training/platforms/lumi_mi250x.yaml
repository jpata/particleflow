name: lumi_mi250x
gpus: 8
# The LAIF wrapper activates the environment before launching the scenario.
python_command: [python3]
data_dir: /scratch/project_465001293/joosep/mlpf/cld/v1.2.5_key4hep_2025-05-29/tfds
experiments_dir: /scratch/project_465001293/joosep/particleflow/experiments
environment:
  MIOPEN_USER_DB_PATH: /tmp/${USER}-${SLURM_JOB_ID}-miopen-cache
  MIOPEN_CUSTOM_CACHE_DIR: /tmp/${USER}-${SLURM_JOB_ID}-miopen-cache
  ROCM_PATH: /opt/rocm
  KERAS_BACKEND: torch
  # Eight DDP ranks share the 32 requested CPU cores. Limit library thread
  # pools so they do not each try to consume the full allocation.
  OMP_NUM_THREADS: "4"
  PYTHONUNBUFFERED: "1"
  NCCL_SOCKET_IFNAME: hsn
  NCCL_NET_GDR_LEVEL: "3"
runtime_overrides:
  # LAIF PyTorch 2.10 cannot compile the dynamic hit-neighborhood grids.
  compile: false
  dtype: bfloat16
  num_workers: 2
  prefetch_factor: 2
  model.attention.use_flash_attn_varlen: true
slurm:
  partition: standard-g
  account: project_465001293
  # standard-g permits 48 hours. The scenario checkpoints every 1,000 steps,
  # so an unfinished allocation can be resumed with --continue.
  time: "2-00:00:00"
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 32
  gpu_request: gpus-per-task
  # Leave operating-system headroom on the 512 GB LUMI-G node.
  memory: 480G
  no_requeue: true
