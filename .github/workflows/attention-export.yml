name: Attention export

on:
  pull_request:
    branches: [main]
    paths:
      - "mlpf/model/**"
      - "mlpf/conf.py"
      - "mlpf/utils.py"
      - "tests/test_attention*.py"
      - "tests/test_heptv2_export.py"
      - "scripts/cms-validate-onnx.py"
      - "pyproject.toml"
      - ".github/workflows/attention-export.yml"
  push:
    branches: [main]
    paths:
      - "mlpf/model/**"
      - "mlpf/conf.py"
      - "mlpf/utils.py"
      - "tests/test_attention*.py"
      - "tests/test_heptv2_export.py"
      - "scripts/cms-validate-onnx.py"
      - "pyproject.toml"
      - ".github/workflows/attention-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Import only the model/export dependencies, not the full training stack.
      - name: Install CPU export environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.11.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'onnx==1.19.1' 'onnxruntime==1.30.0' 'pytest>=8,<10' 'pydantic>=2,<3' 'PyYAML>=6,<7' 'comet-ml>=3,<4' 'einops>=0.8,<0.9' 'psutil>=6,<8'
      - name: Check both formats and numerical contracts on CPU
        run: |
          mkdir -p onnx_validation
          python -m pytest tests/test_attention24_export.py tests/test_attention_export_profiles.py \
            tests/test_heptv2_export.py tests/test_attention_runtime.py \
            -q --basetemp=onnx_validation/export-ci --junitxml=onnx_validation/export-junit.xml
      - name: Retain exported models and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attention-export-cpu
          path: |
            onnx_validation/export-ci/
            onnx_validation/export-junit.xml
          retention-days: 7
