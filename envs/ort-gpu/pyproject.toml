[project]
name = "particleflow-ort-gpu"
version = "3.1.0"
requires-python = "==3.11.*"
dependencies = [
    "particleflow",
    "onnxruntime-gpu==1.29.0",
]

[tool.uv.sources]
particleflow = { path = "../.." }

# PyPI versions >=1.27 use CUDA 13. Resolve only ORT from the CUDA 12 feed.
onnxruntime-gpu = { index = "ort-cuda12" }

[[tool.uv.index]]
name = "ort-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true
